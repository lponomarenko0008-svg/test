<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Registration</title>
</head>
<body class="body">
   <form class="popup" method="" action="">
        <p>
            <button class="button-login" type="button">Login</button>
            <button class="button-register" type="button">Register</button>
        </p>
        <p class="text">  Enter you email and password to register</p>
        <p>
            <label>
                <input class="input" type="text" name="username" placeholder="Username">
            </label>
        </p>
        <p>
            <label>
                <input class="input" type="email" name="email" placeholder="Enter your email">
            </label>
        </p>
         <p>
            <label>
                <input class="input" type="password" name="password" placeholder="Password">
            </label>
        </p>
        <p>
            <label>
                <input class="input-password" type="password" name="password" placeholder="Confirm Password">
            </label>
        </p>
        <p>
            <button class="submit" type="submit">Register</button>
        </p>
        <p class="register-with"> Or register with </p>
        <p>
            <button class="google" type="button">
                <img src="./img/google 1.svg" alt="значок гугл">
                Continue with Google
            </button>
        </p>
         <p>
            <button class="facebook" type="button"> 
                <img src="./img/facebook 1.svg" alt="значок фейбук">
                Continue with Facebook
            </button>
        </p>
   </form> 
</body>
</html>
